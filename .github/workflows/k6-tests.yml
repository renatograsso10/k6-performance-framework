name: K6 Performance Tests

on:
  # Daily scheduled run at 11:00 AM Brasília (UTC-3 = 14:00 UTC)
  schedule:
    - cron: '0 14 * * *'
  push:
    branches: [main, develop]
    paths:
      - 'tests/**'
      - 'src/**'
      - '.github/workflows/k6-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike
          - soak
          - endurance
          - breakpoint
          - all
      environment:
        description: 'Target environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      send_to_grafana:
        description: 'Send metrics to Grafana Cloud'
        required: false
        default: true
        type: boolean

env:
  LOG_LEVEL: INFO
  # Grafana Cloud settings from secrets
  K6_PROMETHEUS_RW_SERVER_URL: ${{ secrets.GRAFANA_PROMETHEUS_URL }}
  K6_PROMETHEUS_RW_USERNAME: ${{ secrets.GRAFANA_USERNAME }}
  K6_PROMETHEUS_RW_PASSWORD: ${{ secrets.GRAFANA_API_TOKEN }}

# Permissions for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ============================================
  # Smoke Test
  # ============================================
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'smoke' || github.event.inputs.test_type == 'all' || github.event_name != 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run Smoke Test
        run: |
          mkdir -p reports
          if [ "${{ github.event.inputs.send_to_grafana }}" != "false" ] && [ -n "${{ secrets.GRAFANA_API_TOKEN }}" ]; then
            k6 run tests/smoke.test.js --out experimental-prometheus-rw --out json=reports/smoke-results.json
          else
            k6 run tests/smoke.test.js --out json=reports/smoke-results.json
          fi
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: reports/
          retention-days: 7

  # ============================================
  # Load Test
  # ============================================
  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'load' || github.event.inputs.test_type == 'all' || github.event_name != 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run Load Test
        run: |
          mkdir -p reports
          if [ "${{ github.event.inputs.send_to_grafana }}" != "false" ] && [ -n "${{ secrets.GRAFANA_API_TOKEN }}" ]; then
            k6 run tests/load.test.js --out experimental-prometheus-rw --out json=reports/load-results.json
          else
            k6 run tests/load.test.js --out json=reports/load-results.json
          fi
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: reports/
          retention-days: 7

  # ============================================
  # Stress Test
  # ============================================
  stress-test:
    name: Stress Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'stress' || github.event.inputs.test_type == 'all' || github.event_name != 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run Stress Test
        run: |
          mkdir -p reports
          if [ "${{ github.event.inputs.send_to_grafana }}" != "false" ] && [ -n "${{ secrets.GRAFANA_API_TOKEN }}" ]; then
            k6 run tests/stress.test.js --out experimental-prometheus-rw --out json=reports/stress-results.json
          else
            k6 run tests/stress.test.js --out json=reports/stress-results.json
          fi
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: reports/
          retention-days: 7

  # ============================================
  # Spike Test
  # ============================================
  spike-test:
    name: Spike Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'spike' || github.event.inputs.test_type == 'all' || github.event_name != 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run Spike Test
        run: |
          mkdir -p reports
          if [ "${{ github.event.inputs.send_to_grafana }}" != "false" ] && [ -n "${{ secrets.GRAFANA_API_TOKEN }}" ]; then
            k6 run tests/spike.test.js --out experimental-prometheus-rw --out json=reports/spike-results.json
          else
            k6 run tests/spike.test.js --out json=reports/spike-results.json
          fi
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-test-results
          path: reports/
          retention-days: 7

  # ============================================
  # Soak Test
  # ============================================
  soak-test:
    name: Soak Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'soak' }}
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run Soak Test
        run: |
          mkdir -p reports
          if [ "${{ github.event.inputs.send_to_grafana }}" != "false" ] && [ -n "${{ secrets.GRAFANA_API_TOKEN }}" ]; then
            k6 run tests/soak.test.js --out experimental-prometheus-rw --out json=reports/soak-results.json
          else
            k6 run tests/soak.test.js --out json=reports/soak-results.json
          fi
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-test-results
          path: reports/
          retention-days: 7

  # ============================================
  # Endurance Test
  # ============================================
  endurance-test:
    name: Endurance Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'endurance' }}
    timeout-minutes: 150
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run Endurance Test
        run: |
          mkdir -p reports
          if [ "${{ github.event.inputs.send_to_grafana }}" != "false" ] && [ -n "${{ secrets.GRAFANA_API_TOKEN }}" ]; then
            k6 run tests/endurance.test.js --out experimental-prometheus-rw --out json=reports/endurance-results.json
          else
            k6 run tests/endurance.test.js --out json=reports/endurance-results.json
          fi
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          ENDURANCE_DURATION: '2h'
      
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endurance-test-results
          path: reports/
          retention-days: 14

  # ============================================
  # Breakpoint Test
  # ============================================
  breakpoint-test:
    name: Breakpoint Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'breakpoint' }}
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run Breakpoint Test
        run: |
          mkdir -p reports
          if [ "${{ github.event.inputs.send_to_grafana }}" != "false" ] && [ -n "${{ secrets.GRAFANA_API_TOKEN }}" ]; then
            k6 run tests/breakpoint.test.js --out experimental-prometheus-rw --out json=reports/breakpoint-results.json
          else
            k6 run tests/breakpoint.test.js --out json=reports/breakpoint-results.json
          fi
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breakpoint-test-results
          path: reports/
          retention-days: 7

  # ============================================
  # Generate Summary Report
  # ============================================
  generate-summary:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: [smoke-test, load-test, stress-test, spike-test, soak-test, endurance-test, breakpoint-test]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results
      
      - name: Create Summary Report
        run: |
          echo "## 🚀 K6 Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📄 Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **[View HTML Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/run-${{ github.run_number }}/)** - Detailed test results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ secrets.GRAFANA_API_TOKEN }}" ]; then
            echo "📈 **[Grafana Dashboard](https://k6testinng.grafana.net/explore)** - Real-time metrics" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "all-results" ]; then
            echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
            
            for dir in all-results/*/; do
              test_name=$(basename "$dir" | sed 's/-test-results//')
              echo "| $test_name | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No test results found." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Generated by K6 Performance Framework*" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Deploy Reports to GitHub Pages
  # ============================================
  deploy-report:
    name: Deploy Report to GitHub Pages
    runs-on: ubuntu-latest
    needs: [generate-summary]
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results
      
      - name: Prepare report directory
        run: |
          mkdir -p gh-pages/run-${{ github.run_number }}
          
          # Copy all HTML reports and collect their names
          REPORT_LINKS=""
          for dir in all-results/*/; do
            if [ -d "$dir" ]; then
              for file in "$dir"*.html; do
                if [ -f "$file" ]; then
                  filename=$(basename "$file")
                  cp "$file" gh-pages/run-${{ github.run_number }}/ 2>/dev/null || true
                  if [ "$filename" != "index.html" ]; then
                    name=$(echo "$filename" | sed 's/-report.html//' | sed 's/.html//' | tr '[:lower:]' '[:upper:]')
                    REPORT_LINKS="$REPORT_LINKS<a href=\"$filename\"><span class=\"icon\">📊</span>$name Test Report</a>"
                  fi
                fi
              done
              # Note: JSON files are NOT copied to avoid GitHub's 100MB limit
            fi
          done
          
          # Default message if no reports
          if [ -z "$REPORT_LINKS" ]; then
            REPORT_LINKS='<p style="color:#94a3b8">No reports found in this run.</p>'
          fi
          
          # Generate static index.html for this run
          cat > gh-pages/run-${{ github.run_number }}/index.html << RUNEOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>K6 Test Reports - Run #${{ github.run_number }}</title>
              <style>
                  :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --primary: #7c3aed; }
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
                  .container { max-width: 800px; margin: 0 auto; }
                  h1 { font-size: 2rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #7c3aed, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
                  .meta { color: var(--muted); margin-bottom: 2rem; }
                  .reports { display: grid; gap: 1rem; }
                  a { display: block; background: var(--card); padding: 1.5rem; border-radius: 12px; text-decoration: none; color: var(--text); transition: all 0.3s; border: 1px solid rgba(255,255,255,0.1); }
                  a:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); background: #334155; }
                  .icon { font-size: 1.5rem; margin-right: 0.75rem; }
                  .back { display: inline-block; margin-top: 2rem; color: var(--primary); text-decoration: none; background: transparent; border: none; padding: 0; }
                  .back:hover { background: transparent; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>K6 Performance Reports</h1>
                  <p class="meta">Run #${{ github.run_number }} | ${{ github.event_name }} | $(date '+%Y-%m-%d %H:%M:%S UTC')</p>
                  <div class="reports">$REPORT_LINKS</div>
                  <a href="../" class="back">← All Runs</a>
              </div>
          </body>
          </html>
          RUNEOF
      
      - name: Generate main index
        run: |
          # Fetch existing runs.json from gh-pages if it exists
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git show gh-pages:runs.json > gh-pages/runs.json 2>/dev/null; then
            echo "Found existing runs.json"
          else
            echo "[]" > gh-pages/runs.json
          fi
          
          # Add current run to runs.json
          CURRENT_RUN=${{ github.run_number }}
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Read existing runs and add new one
          EXISTING=$(cat gh-pages/runs.json)
          echo "$EXISTING" | jq --arg run "$CURRENT_RUN" --arg ts "$TIMESTAMP" \
            '. + [{"run": $run, "timestamp": $ts}] | unique_by(.run) | sort_by(.run | tonumber) | reverse' \
            > gh-pages/runs.json
          
          # Create main index.html that reads from runs.json
          cat > gh-pages/index.html << 'INDEXEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>K6 Performance Reports</title>
              <style>
                  :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --primary: #7c3aed; }
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
                  .container { max-width: 800px; margin: 0 auto; }
                  h1 { font-size: 2rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #7c3aed, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
                  .subtitle { color: var(--muted); margin-bottom: 2rem; }
                  .runs { display: grid; gap: 1rem; }
                  a { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 1.25rem 1.5rem; border-radius: 12px; text-decoration: none; color: var(--text); transition: all 0.3s; border: 1px solid rgba(255,255,255,0.1); }
                  a:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); border-color: var(--primary); }
                  .run-info { display: flex; align-items: center; gap: 0.75rem; }
                  .icon { font-size: 1.25rem; }
                  .date { color: var(--muted); font-size: 0.875rem; }
                  .loading { color: var(--muted); text-align: center; padding: 2rem; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>K6 Performance Reports</h1>
                  <p class="subtitle">Automated performance test results</p>
                  <div class="runs" id="runs"><p class="loading">Loading reports...</p></div>
              </div>
              <script>
                  fetch('runs.json')
                      .then(r => r.json())
                      .then(runs => {
                          const container = document.getElementById('runs');
                          if (runs.length === 0) {
                              container.innerHTML = '<p style="color:#94a3b8">No reports yet.</p>';
                              return;
                          }
                          container.innerHTML = runs.map(r => {
                              const date = new Date(r.timestamp).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                              return '<a href="run-' + r.run + '/"><div class="run-info"><span class="icon">📊</span><span>Run #' + r.run + '</span></div><span class="date">' + date + '</span></a>';
                          }).join('');
                      })
                      .catch(() => {
                          document.getElementById('runs').innerHTML = '<p style="color:#94a3b8">No reports yet.</p>';
                      });
              </script>
          </body>
          </html>
          INDEXEOF
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy report for run #${{ github.run_number }}'
