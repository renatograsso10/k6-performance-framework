name: K6 Performance Tests

on:
  # Daily scheduled run at 11:00 AM Brasília (UTC-3 = 14:00 UTC)
  schedule:
    - cron: '0 14 * * *'
  push:
    branches: [main, develop]
    paths:
      - 'tests/**'
      - 'src/**'
      - '.github/workflows/k6-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike
          - soak
          - endurance
          - breakpoint
          - all
      environment:
        description: 'Target environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      send_to_grafana:
        description: 'Send metrics to Grafana Cloud'
        required: false
        default: true
        type: boolean

env:
  LOG_LEVEL: INFO
  # Grafana Cloud settings from secrets
  K6_PROMETHEUS_RW_SERVER_URL: ${{ secrets.GRAFANA_PROMETHEUS_URL }}
  K6_PROMETHEUS_RW_USERNAME: ${{ secrets.GRAFANA_USERNAME }}
  K6_PROMETHEUS_RW_PASSWORD: ${{ secrets.GRAFANA_API_TOKEN }}

# Permissions for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ============================================
  # Smoke Test
  # ============================================
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'smoke' || github.event.inputs.test_type == 'all' || github.event_name != 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run Smoke Test
        run: |
          mkdir -p reports
          if [ "${{ github.event.inputs.send_to_grafana }}" != "false" ] && [ -n "${{ secrets.GRAFANA_API_TOKEN }}" ]; then
            k6 run tests/smoke.test.js --out experimental-prometheus-rw --out json=reports/smoke-results.json
          else
            k6 run tests/smoke.test.js --out json=reports/smoke-results.json
          fi
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: reports/
          retention-days: 7

  # ============================================
  # Load Test
  # ============================================
  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'load' || github.event.inputs.test_type == 'all' }}
    needs: [smoke-test]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run Load Test
        run: |
          mkdir -p reports
          if [ "${{ github.event.inputs.send_to_grafana }}" != "false" ] && [ -n "${{ secrets.GRAFANA_API_TOKEN }}" ]; then
            k6 run tests/load.test.js --out experimental-prometheus-rw --out json=reports/load-results.json
          else
            k6 run tests/load.test.js --out json=reports/load-results.json
          fi
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: reports/
          retention-days: 7

  # ============================================
  # Stress Test
  # ============================================
  stress-test:
    name: Stress Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'stress' || github.event.inputs.test_type == 'all' }}
    needs: [load-test]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run Stress Test
        run: |
          mkdir -p reports
          if [ "${{ github.event.inputs.send_to_grafana }}" != "false" ] && [ -n "${{ secrets.GRAFANA_API_TOKEN }}" ]; then
            k6 run tests/stress.test.js --out experimental-prometheus-rw --out json=reports/stress-results.json
          else
            k6 run tests/stress.test.js --out json=reports/stress-results.json
          fi
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: reports/
          retention-days: 7

  # ============================================
  # Spike Test
  # ============================================
  spike-test:
    name: Spike Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'spike' || github.event.inputs.test_type == 'all' }}
    needs: [smoke-test]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run Spike Test
        run: |
          mkdir -p reports
          if [ "${{ github.event.inputs.send_to_grafana }}" != "false" ] && [ -n "${{ secrets.GRAFANA_API_TOKEN }}" ]; then
            k6 run tests/spike.test.js --out experimental-prometheus-rw --out json=reports/spike-results.json
          else
            k6 run tests/spike.test.js --out json=reports/spike-results.json
          fi
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-test-results
          path: reports/
          retention-days: 7

  # ============================================
  # Soak Test
  # ============================================
  soak-test:
    name: Soak Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'soak' }}
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run Soak Test
        run: |
          mkdir -p reports
          if [ "${{ github.event.inputs.send_to_grafana }}" != "false" ] && [ -n "${{ secrets.GRAFANA_API_TOKEN }}" ]; then
            k6 run tests/soak.test.js --out experimental-prometheus-rw --out json=reports/soak-results.json
          else
            k6 run tests/soak.test.js --out json=reports/soak-results.json
          fi
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-test-results
          path: reports/
          retention-days: 7

  # ============================================
  # Endurance Test
  # ============================================
  endurance-test:
    name: Endurance Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'endurance' }}
    timeout-minutes: 150
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run Endurance Test
        run: |
          mkdir -p reports
          if [ "${{ github.event.inputs.send_to_grafana }}" != "false" ] && [ -n "${{ secrets.GRAFANA_API_TOKEN }}" ]; then
            k6 run tests/endurance.test.js --out experimental-prometheus-rw --out json=reports/endurance-results.json
          else
            k6 run tests/endurance.test.js --out json=reports/endurance-results.json
          fi
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          ENDURANCE_DURATION: '2h'
      
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endurance-test-results
          path: reports/
          retention-days: 14

  # ============================================
  # Breakpoint Test
  # ============================================
  breakpoint-test:
    name: Breakpoint Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'breakpoint' }}
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run Breakpoint Test
        run: |
          mkdir -p reports
          if [ "${{ github.event.inputs.send_to_grafana }}" != "false" ] && [ -n "${{ secrets.GRAFANA_API_TOKEN }}" ]; then
            k6 run tests/breakpoint.test.js --out experimental-prometheus-rw --out json=reports/breakpoint-results.json
          else
            k6 run tests/breakpoint.test.js --out json=reports/breakpoint-results.json
          fi
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breakpoint-test-results
          path: reports/
          retention-days: 7

  # ============================================
  # Generate Summary Report
  # ============================================
  generate-summary:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results
      
      - name: Create Summary Report
        run: |
          echo "## 🚀 K6 Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📄 Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **[View HTML Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/run-${{ github.run_number }}/)** - Detailed test results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ secrets.GRAFANA_API_TOKEN }}" ]; then
            echo "📈 **[Grafana Dashboard](https://k6testinng.grafana.net/explore)** - Real-time metrics" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "all-results" ]; then
            echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
            
            for dir in all-results/*/; do
              test_name=$(basename "$dir" | sed 's/-test-results//')
              echo "| $test_name | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No test results found." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Generated by K6 Performance Framework*" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Deploy Reports to GitHub Pages
  # ============================================
  deploy-report:
    name: Deploy Report to GitHub Pages
    runs-on: ubuntu-latest
    needs: [generate-summary]
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results
      
      - name: Prepare report directory
        run: |
          mkdir -p gh-pages/run-${{ github.run_number }}
          
          # Copy all HTML reports
          for dir in all-results/*/; do
            if [ -d "$dir" ]; then
              cp -r "$dir"*.html gh-pages/run-${{ github.run_number }}/ 2>/dev/null || true
              cp -r "$dir"*.json gh-pages/run-${{ github.run_number }}/ 2>/dev/null || true
            fi
          done
          
          # Generate index.html for this run
          cat > gh-pages/run-${{ github.run_number }}/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>K6 Test Reports - Run #${{ github.run_number }}</title>
              <style>
                  :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --primary: #7c3aed; }
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
                  .container { max-width: 800px; margin: 0 auto; }
                  h1 { font-size: 2rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #7c3aed, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
                  .meta { color: var(--muted); margin-bottom: 2rem; }
                  .reports { display: grid; gap: 1rem; }
                  a { display: block; background: var(--card); padding: 1.5rem; border-radius: 12px; text-decoration: none; color: var(--text); transition: all 0.3s; border: 1px solid rgba(255,255,255,0.1); }
                  a:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); background: #334155; }
                  .icon { font-size: 1.5rem; margin-right: 0.75rem; }
                  .back { display: inline-block; margin-top: 2rem; color: var(--primary); text-decoration: none; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>K6 Performance Reports</h1>
                  <p class="meta">Run #${{ github.run_number }} | ${{ github.event_name }} | $(date '+%Y-%m-%d %H:%M:%S UTC')</p>
                  <div class="reports" id="reports"></div>
                  <a href="../" class="back">← All Runs</a>
              </div>
              <script>
                  const files = document.querySelectorAll ? null : null;
                  fetch('.')
                      .then(r => r.text())
                      .then(html => {
                          const matches = html.match(/href="([^"]+\.html)"/g) || [];
                          const reports = document.getElementById('reports');
                          matches.forEach(m => {
                              const file = m.match(/href="([^"]+)"/)[1];
                              if (file !== 'index.html') {
                                  const name = file.replace('-report.html', '').replace('.html', '').toUpperCase();
                                  reports.innerHTML += '<a href="' + file + '"><span class="icon">📊</span>' + name + ' Test Report</a>';
                              }
                          });
                          if (reports.innerHTML === '') reports.innerHTML = '<p style="color:#94a3b8">No reports found in this run.</p>';
                      });
              </script>
          </body>
          </html>
          EOF
      
      - name: Generate main index
        run: |
          # Create/update main index.html
          cat > gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>K6 Performance Reports</title>
              <style>
                  :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; }
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
                  .container { max-width: 800px; margin: 0 auto; }
                  h1 { font-size: 2rem; margin-bottom: 2rem; background: linear-gradient(135deg, #7c3aed, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
                  .runs { display: grid; gap: 1rem; }
                  a { display: block; background: var(--card); padding: 1.5rem; border-radius: 12px; text-decoration: none; color: var(--text); transition: all 0.3s; border: 1px solid rgba(255,255,255,0.1); }
                  a:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>K6 Performance Reports</h1>
                  <div class="runs" id="runs"></div>
              </div>
              <script>
                  fetch('.')
                      .then(r => r.text())
                      .then(html => {
                          const matches = html.match(/href="(run-\d+)\/?"/g) || [];
                          const runs = document.getElementById('runs');
                          const unique = [...new Set(matches.map(m => m.match(/run-(\d+)/)[1]))];
                          unique.sort((a, b) => parseInt(b) - parseInt(a));
                          unique.forEach(num => {
                              runs.innerHTML += '<a href="run-' + num + '/">📁 Run #' + num + '</a>';
                          });
                          if (runs.innerHTML === '') runs.innerHTML = '<p style="color:#94a3b8">No reports yet.</p>';
                      });
              </script>
          </body>
          </html>
          EOF
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy report for run #${{ github.run_number }}'
