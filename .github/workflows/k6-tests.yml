name: K6 Performance Tests

on:
  schedule:
    # 11:00 America/Sao_Paulo (14:00 UTC). Public probe only.
    - cron: '0 14 * * *'
    # Sunday 11:00 America/Sao_Paulo (14:00 UTC). Controlled local-container load.
    - cron: '0 14 * * 0'
  push:
    branches: [main, develop]
    paths:
      - 'tests/**'
      - 'src/**'
      - 'scripts/**'
      - 'lab/**'
      - 'package.json'
      - '.github/workflows/k6-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Profile; heavy profiles require controlled K6_BASE_URL'
        required: true
        default: smoke
        type: choice
        options: [smoke, load, stress, spike, soak, endurance, breakpoint, all]
      environment:
        description: 'Target environment label'
        required: false
        default: production
        type: choice
        options: [production, staging, development]
      send_to_grafana:
        description: 'Send heavy-profile metrics to Grafana Cloud'
        required: false
        default: true
        type: boolean

env:
  K6_VERSION: '1.5.0'
  LOG_LEVEL: ERROR
  RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

permissions:
  contents: read

concurrency:
  group: k6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    name: Regression validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up pinned k6
        uses: grafana/setup-k6-action@c00053c996b4061198c9c24a00474b748abdf8b7 # v1
        with:
          k6-version: ${{ env.K6_VERSION }}
      - name: Run regression suite
        run: npm run test:ci

  smoke-fixture:
    name: Smoke against deterministic fixture
    needs: validation
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.test_type == 'smoke' ||
       inputs.test_type == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up pinned k6
        uses: grafana/setup-k6-action@c00053c996b4061198c9c24a00474b748abdf8b7 # v1
        with:
          k6-version: ${{ env.K6_VERSION }}
      - name: Run fixture Smoke
        run: node scripts/ci/run-profile.mjs smoke
      - name: Upload Smoke results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-test-results
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  external-smoke:
    name: Public SWAPI external smoke
    needs: validation
    if: github.event_name == 'schedule' && github.event.schedule == '0 14 * * *'
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up pinned k6
        uses: grafana/setup-k6-action@c00053c996b4061198c9c24a00474b748abdf8b7 # v1
        with:
          k6-version: ${{ env.K6_VERSION }}
      - name: Run non-blocking public probe
        id: run
        continue-on-error: true
        env:
          BASE_URL: https://swapi.info
          TARGET_KIND: public-cdn
        run: node scripts/ci/run-profile.mjs external-smoke
      - name: Upload external-smoke results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: external-smoke-results
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  scheduled-load-lab:
    name: Weekly controlled SWAPI load
    needs: validation
    if: github.event_name == 'schedule' && github.event.schedule == '0 14 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up pinned k6
        uses: grafana/setup-k6-action@c00053c996b4061198c9c24a00474b748abdf8b7 # v1
        with:
          k6-version: ${{ env.K6_VERSION }}
      - name: Run load against self-hosted SWAPI
        run: npm run lab:load
      - name: Upload controlled load results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scheduled-load-lab-results
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  select-performance:
    name: Select heavy profiles
    needs: validation
    if: github.event_name == 'workflow_dispatch' && inputs.test_type != 'smoke'
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.select.outputs.profiles }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build serialized profile matrix
        id: select
        run: node scripts/ci/select-profiles.mjs "${{ inputs.test_type }}"

  performance:
    name: ${{ matrix.profile }}
    needs: [validation, select-performance]
    if: needs.select-performance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: ${{ fromJSON(needs.select-performance.outputs.profiles) }}
    env:
      BASE_URL: ${{ vars.K6_BASE_URL }}
      TARGET_KIND: controlled-remote
      ENVIRONMENT: ${{ inputs.environment || 'production' }}
      K6_PROMETHEUS_RW_SERVER_URL: ${{ secrets.GRAFANA_PROMETHEUS_URL }}
      K6_PROMETHEUS_RW_USERNAME: ${{ secrets.GRAFANA_USERNAME }}
      K6_PROMETHEUS_RW_PASSWORD: ${{ secrets.GRAFANA_API_TOKEN }}
      SEND_TO_GRAFANA: ${{ inputs.send_to_grafana }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up pinned k6
        uses: grafana/setup-k6-action@c00053c996b4061198c9c24a00474b748abdf8b7 # v1
        with:
          k6-version: ${{ env.K6_VERSION }}
      - name: Run heavy profile
        run: node scripts/ci/run-profile.mjs "${{ matrix.profile }}"
      - name: Upload profile results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.profile }}-test-results
          path: reports/
          if-no-files-found: warn
          retention-days: ${{ matrix.profile == 'endurance' && 14 || 7 }}

  generate-summary:
    name: Generate accurate run summary
    needs: [validation, smoke-fixture, external-smoke, scheduled-load-lab, select-performance, performance]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      publishable: ${{ steps.summary.outputs.publishable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Download available artifacts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: all-results
      - name: Record job outcomes
        id: summary
        env:
          VALIDATION: ${{ needs.validation.result }}
          SMOKE: ${{ needs.smoke-fixture.result }}
          EXTERNAL_JOB: ${{ needs.external-smoke.result }}
          EXTERNAL_TEST: ${{ needs.external-smoke.outputs.outcome }}
          LAB: ${{ needs.scheduled-load-lab.result }}
          PERFORMANCE: ${{ needs.performance.result }}
        run: node scripts/ci/generate-summary.mjs

  deploy-report:
    name: Deploy successful reports
    needs: generate-summary
    if: >-
      needs.generate-summary.outputs.publishable == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: all-results
      - name: Prepare static report
        run: >-
          node scripts/ci/publish-reports.mjs
          --source all-results
          --destination gh-pages
          --run-number "${{ github.run_number }}"
      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: false
          force_orphan: true
          commit_message: 'Deploy report for run #${{ github.run_number }}'
