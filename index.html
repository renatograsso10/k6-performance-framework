<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K6 Performance Reports</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --primary: #7c3aed; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #7c3aed, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--muted); margin-bottom: 2rem; }
        .runs { display: grid; gap: 1rem; }
        a { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 1.25rem 1.5rem; border-radius: 12px; text-decoration: none; color: var(--text); transition: all 0.3s; border: 1px solid rgba(255,255,255,0.1); }
        a:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); border-color: var(--primary); }
        .run-info { display: flex; align-items: center; gap: 0.75rem; }
        .icon { font-size: 1.25rem; }
        .date { color: var(--muted); font-size: 0.875rem; }
        .loading { color: var(--muted); text-align: center; padding: 2rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>K6 Performance Reports</h1>
        <p class="subtitle">Automated performance test results</p>
        <div class="runs" id="runs"><p class="loading">Loading reports...</p></div>
    </div>
    <script>
        fetch('runs.json')
            .then(r => r.json())
            .then(runs => {
                const container = document.getElementById('runs');
                if (runs.length === 0) {
                    container.innerHTML = '<p style="color:#94a3b8">No reports yet.</p>';
                    return;
                }
                container.innerHTML = runs.map(r => {
                    const date = new Date(r.timestamp).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    return '<a href="run-' + r.run + '/"><div class="run-info"><span class="icon">📊</span><span>Run #' + r.run + '</span></div><span class="date">' + date + '</span></a>';
                }).join('');
            })
            .catch(() => {
                document.getElementById('runs').innerHTML = '<p style="color:#94a3b8">No reports yet.</p>';
            });
    </script>
</body>
</html>
