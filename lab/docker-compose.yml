services:
  swapi:
    build:
      context: https://github.com/SivaramPg/swapi.info.git#f272a7e88e801057588d137d1343b04098811343
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:3000:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/api/people/1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: 'no'
